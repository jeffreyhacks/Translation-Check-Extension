<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Translation Check</title>
</head>
<body>
  <header class="bar">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path d="M6 9h12M6 12h8M6 15h10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><rect x="5" y="10.6" width="9" height="2.8" rx="1.4" fill="#ffd60a" opacity=".9"/></svg>
    <label class="lang" title="Language the page should be in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
      <select id="lang" aria-label="Target language"></select>
    </label>
    <button id="settingsBtn" class="icon" title="Settings" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button id="openPanel" class="icon" hidden title="Keep open in the side panel"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  </header>

  <section id="settings" class="drawer" hidden>
    <div class="seg" id="mode" role="radiogroup" aria-label="Strictness">
      <label title="Assume unclear text is translated"><input type="radio" name="mode" value="relaxed"><span>Relaxed</span></label>
      <label title="Recommended"><input type="radio" name="mode" value="balanced" checked><span>Balanced</span></label>
      <label title="List everything that is unclear"><input type="radio" name="mode" value="strict"><span>Strict</span></label>
    </div>
    <div class="toggles">
      <label class="sw" title="Placeholders, alt text and tooltips"><input type="checkbox" id="attrs" checked><i></i><span>Attributes</span></label>
      <label class="sw" title="Also mark text that can’t be judged"><input type="checkbox" id="unsure"><i></i><span>Show unsure</span></label>
      <label class="sw" title="Spanish/Portuguese, Danish/Norwegian…"><input type="checkbox" id="related" checked><i></i><span>Related languages</span></label>
      <label class="sw" title="Double-check every warning with CLD3 and franc"><input type="checkbox" id="verify" checked><i></i><span>CLD3 + franc</span></label>
      <label class="sw" title="Only show warnings that two or more models agree on"><input type="checkbox" id="confirmed"><i></i><span>Confirmed only</span></label>
      <label class="sw" title="Re-check automatically when the page changes"><input type="checkbox" id="live" checked><i></i><span>Live</span></label>
      <label class="sw" title="Compare with the source-language version (hreflang)"><input type="checkbox" id="source" checked><i></i><span>Source compare</span></label>
      <label class="sw" title="Number, price and date format hints"><input type="checkbox" id="hints"><i></i><span>Format hints</span></label>
      <label class="sw" title="Check this site automatically when it loads"><input type="checkbox" id="auto"><i></i><span>Auto-check <b id="hostName">site</b></span></label>
    </div>
    <details class="ignore">
      <summary>Ignore list</summary>
      <textarea id="ignoreSite" rows="2" placeholder="This site — one term per line"></textarea>
      <textarea id="ignoreGlobal" rows="2" placeholder="All sites — one term per line"></textarea>
      <div class="row"><button id="impIgnore" class="ghost">Import</button><button id="expIgnore" class="ghost">Export</button><input type="file" id="impFile" accept="application/json" hidden></div>
    </details>
  </section>

  <div class="actions">
    <button id="scan" class="go"><svg id="scanIcon" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span id="scanLabel">Check page</span></button>
    <button id="clear" class="icon" title="Clear marks"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <p id="status" role="status"></p>

  <section id="result" hidden>
    <div class="hero">
      <div class="ring" id="ring">
        <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15.9" pathLength="100"/><circle class="arc" id="arc" cx="18" cy="18" r="15.9" pathLength="100" stroke-dasharray="0 100"/></svg>
        <b id="score">–</b>
      </div>
      <div class="stats">
        <div class="stat ok" title="Translated"><i></i><b id="nOk">0</b><span>translated</span></div>
        <div class="stat bad" title="Not translated"><i></i><b id="nBad">0</b><span>untranslated</span></div>
        <div class="stat unsure" title="Can’t tell"><i></i><b id="nUnsure">0</b><span>unclear</span></div>
      </div>
    </div>

    <div class="chips" id="chips"></div>

    <div id="mismatch" class="banner" hidden>
      <span id="mismatchText"></span>
      <button id="mismatchFix"></button>
    </div>

    <div class="tabs" role="tablist">
      <button role="tab" id="tabBad" aria-selected="true" title="Not translated"><i class="dot bad"></i><span class="lbl">Untranslated</span><span class="n">0</span></button>
      <button role="tab" id="tabUnsure" aria-selected="false" title="Can’t tell"><i class="dot unsure"></i><span class="lbl">Unclear</span><span class="n">0</span></button>
      <button role="tab" id="tabBug" aria-selected="false" title="Broken text" hidden><i class="dot bug"></i><span class="lbl">Broken</span><span class="n">0</span></button>
      <button role="tab" id="tabFmt" aria-selected="false" title="Format hints" hidden><i class="dot fmt"></i><span class="lbl">Format</span><span class="n">0</span></button>
    </div>
    <div class="nav">
      <button id="prev" class="icon sm" title="Previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="pos">0 / 0</span>
      <button id="next" class="icon sm" title="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <span class="spacer"></span>
      <button id="expCsv" class="ghost" title="Download CSV"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>CSV</button>
      <button id="expHtml" class="ghost" title="Download HTML report"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Report</button>
    </div>
    <ul id="list"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
